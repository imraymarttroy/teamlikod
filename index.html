<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Likod</title>
<meta name="description" content="Team Likod. December 7, 2026.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Familjen+Grotesk:wght@400;600;700&family=Permanent+Marker&family=Reenie+Beanie&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: "Sister Spray";
    src: url("fonts/SisterSpray.ttf") format("truetype");
    font-display: swap;
  }
  :root {
    --black: #000000;
    --ink: #2b2b2b;
    --chalk: #ffffff;
    --dim: #9c9c9c;
    --tarp: #ffffff;
    --red: #ffffff;
    --blue: #6e6e6e;
    --pink: #bdbdbd;
    --display: "Alfa Slab One", Rockwell, Georgia, serif;
    --marker: "Permanent Marker", "Segoe Print", cursive;
    --scrawl: "Reenie Beanie", "Segoe Print", cursive;
    --body: "Familjen Grotesk", "Trebuchet MS", sans-serif;
    --gutter: clamp(1.25rem, 4vw, 3.5rem);
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--black); scroll-behavior: smooth; }
  body {
    background: var(--black);
    color: var(--chalk);
    font: 400 1.125rem/1.5 var(--body);
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

  /* Hero */
  .hero {
    position: relative;
    min-height: 100svh;
    padding: var(--gutter);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(1.25rem, 3vh, 2rem);
    overflow: hidden;
    background: var(--black);
    isolation: isolate;
    --x: -999px;
    --y: -999px;
  }
  .desk {
    position: absolute;
    inset: 0;
    pointer-events: none;
    font-family: var(--scrawl);
    color: var(--chalk);
    -webkit-mask-image: radial-gradient(circle 230px at var(--x) var(--y), #000 25%, transparent 100%);
    mask-image: radial-gradient(circle 230px at var(--x) var(--y), #000 25%, transparent 100%);
  }
  .desk span { position: absolute; font-size: clamp(1.8rem, 3.4vw, 3.2rem); line-height: 1; white-space: nowrap; }
  .hero > *:not(.desk) { position: relative; }

  h1 { width: 100%; }
  #lockup { display: block; width: 100%; height: auto; max-height: 46svh; overflow: visible; user-select: none; }
  #lockup text { font-family: "Sister Spray", var(--display); }
  #lockup .mark text { font-family: var(--marker); }
  .letter { transform-box: fill-box; transform-origin: center; transition: transform .18s cubic-bezier(.3,1.8,.5,1); touch-action: manipulation; }
  .letter.hit { transform: translateY(-18px) rotate(var(--r, -6deg)); }

  .when {
    font-size: clamp(1.0625rem, 1.5vw, 1.25rem);
    font-weight: 400;
    line-height: 1.3;
    text-align: center;
  }

  /* Countdown */
  .clock {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    width: min(100%, 520px);
    border: 1px solid var(--chalk);
  }
  .seg {
    padding: .8rem .25rem .7rem;
    text-align: center;
    border-left: 1px solid var(--chalk);
    transition: background .15s, color .15s;
    touch-action: manipulation;
  }
  .seg:first-child { border-left: 0; }
  .seg:hover, .seg[aria-pressed="true"] { background: var(--chalk); color: var(--black); }
  .num {
    display: flex;
    justify-content: center;
    font: 700 clamp(1.75rem, 5vw, 2.75rem)/1 var(--body);
  }
  .d { display: block; width: .62em; height: 1em; overflow: hidden; }
  .d i { display: block; font-style: normal; animation: roll .22s ease-out; }
  @keyframes roll { from { transform: translateY(100%); } to { transform: none; } }
  .unit { display: block; margin-top: .35rem; font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; }
  .readout { min-height: 1.5em; margin-top: -.75rem; color: var(--dim); font-size: 1rem; font-variant-numeric: tabular-nums; }
  .party-now {
    grid-column: 1 / -1;
    padding: .6em;
    text-align: center;
    font: 700 clamp(1.5rem, 4vw, 2.25rem)/1 var(--body);
  }

  /* Google Calendar */
  .cal {
    padding: .75em 1.4em;
    border: 1px solid var(--chalk);
    background: var(--chalk);
    color: var(--black);
    font-size: 1.0625rem;
    line-height: 1;
    text-decoration: none;
    transition: background .15s, color .15s;
  }
  .cal:hover { background: var(--black); color: var(--chalk); }

  .bit {
    position: fixed;
    top: -20px;
    width: 12px;
    height: 18px;
    z-index: 60;
    pointer-events: none;
    animation: fall var(--t) linear forwards;
  }
  @keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--spin)); } }

  /* Sections */
  section.block { padding: clamp(4rem, 10vw, 8rem) var(--gutter); overflow-x: clip; }
  h2 { font: 400 clamp(1.75rem, 3.4vw, 2.75rem)/1.15 var(--body); letter-spacing: -.01em; }
  .intro { max-width: 52ch; margin-top: .6rem; color: var(--dim); font-size: 1.0625rem; }

  /* Team */
  .members { background: var(--black); border-top: 1px solid #5a5a5a; }
  .team {
    list-style: none;
    padding: 0;
    margin-top: clamp(2rem, 5vw, 3.5rem);
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr));
    gap: clamp(2rem, 4vw, 3rem) clamp(1rem, 2.5vw, 2rem);
  }
  .face {
    aspect-ratio: 4 / 5;
    display: grid;
    place-items: center;
    background: #1c1c1c;
    color: #6e6e6e;
    font: 400 clamp(1.5rem, 3vw, 2.25rem)/1 var(--body);
    overflow: hidden;
  }
  .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .member h3 { margin-top: 1rem; font: 600 1.125rem/1.25 var(--body); }
  .bio { margin-top: .35rem; color: var(--dim); max-width: 46ch; font-size: 1rem; }

  /* Gallery */
  .gallery { border-top: 1px solid #5a5a5a; }
  .gallery + .gallery { border-top: 0; padding-top: 0; }
  .strip {
    margin: clamp(2rem, 5vw, 3.5rem) calc(var(--gutter) * -1) 0;
    overflow: hidden;
  }
  /* Dalawang kopya ng mga larawan, kaya tuloy-tuloy ang -50% */
  .photos {
    list-style: none;
    padding: 0;
    display: flex;
    width: max-content;
    animation: slide-left 60s linear infinite;
  }
  @keyframes slide-left { to { transform: translateX(-50%); } }
  .soon {
    margin-top: clamp(2rem, 5vw, 3.5rem);
    height: max(180px, 21vw);
    display: grid;
    place-items: center;
    background: #1c1c1c;
    font: 400 clamp(3rem, 8vw, 6rem)/1 var(--scrawl);
  }
  .photo {
    flex: none;
    width: max(240px, 28vw);
    margin-right: clamp(.5rem, 1.2vw, 1rem);
    aspect-ratio: 4 / 3;
    display: grid;
    place-items: center;
    background: #1c1c1c;
    color: #6e6e6e;
    font-size: 1rem;
    overflow: hidden;
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

  footer { padding: 2rem var(--gutter) 3rem; color: var(--dim); font-family: var(--scrawl); font-size: 2rem; line-height: 1.1; }

  @media (max-width: 720px) {
    #lockup { max-height: none; }
    .desk span:nth-child(n+6):nth-child(-n+7) { display: none; }
    .desk span:nth-child(8) { left: 5% !important; top: 94% !important; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .strip { overflow-x: auto; }
    .photo[aria-hidden] { display: none; }
  }
</style>
</head>
<body>

<header class="hero" id="hero">
  <div class="desk" aria-hidden="true">
    <span style="left:6%;top:7%;transform:rotate(-4deg)">sino ang nasa likod mo?</span>
    <span style="left:60%;top:6%;transform:rotate(3deg)">sino may ballpen?</span>
    <span style="left:80%;top:17%;transform:rotate(-7deg)">walang iwanan</span>
    <span style="left:38%;top:12%;transform:rotate(5deg)">Likod forever</span>
    <span style="left:4%;top:46%;transform:rotate(3deg)">present po, Sir</span>
    <span style="left:80%;top:95%;transform:rotate(-3deg)">may nakakaalam</span>
    <span style="left:78%;top:85%;transform:rotate(2deg)">seen ka namin</span>
    <span style="left:58%;top:91%;transform:rotate(-2deg)">Dec 7, walang late</span>
  </div>

  <h1 id="title">
    <svg id="lockup" role="img" aria-label="Team Likod V.6" viewBox="0 0 1100 420" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="graph" width="16" height="16" patternUnits="userSpaceOnUse">
          <rect width="16" height="16" fill="#fff"/>
          <path d="M16 0H0V16" fill="none" stroke="#8f8f8f" stroke-width="1.1"/>
        </pattern>
      </defs>
    </svg>
  </h1>
  <p class="when">Year End Party, December 7, 2026, Huwag kang makakalimot!</p>

  <div class="clock" id="clock" role="timer" aria-label="Countdown hanggang December 7, 2026">
    <button class="seg" type="button" data-unit="days"><span class="num" id="days"></span><span class="unit">Araw</span></button>
    <button class="seg" type="button" data-unit="hours"><span class="num" id="hours"></span><span class="unit">Oras</span></button>
    <button class="seg" type="button" data-unit="minutes"><span class="num" id="minutes"></span><span class="unit">Minuto</span></button>
    <button class="seg" type="button" data-unit="seconds"><span class="num" id="seconds"></span><span class="unit">Segundo</span></button>
  </div>
  <p class="readout" id="readout"></p>

  <a class="cal" target="_blank" rel="noopener" href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=Team%20Likod%20Year%20End%20Party&amp;dates=20261207/20261208&amp;ctz=Asia/Manila">Idagdag sa Google Calendar</a>
</header>

<main>
  <section class="block members" aria-labelledby="members-title">
    <h2 id="members-title">Ang Team</h2>
    <ul class="team" id="team"></ul>
  </section>

  <div id="galleries"></div>
</main>

<footer>Team Likod. Nasa likod mo lang kami.</footer>

<script>
  /* ====== PALITAN DITO ANG MGA MEMBER ======
     name: pangalan
     bio:  description
     photo: optional, hal. "images/juan.jpg"   */
  const MEMBERS = [
    { name: "Member 1", bio: "Ilagay dito ang description ni Member 1." },
    { name: "Member 2", bio: "Ilagay dito ang description ni Member 2." },
    { name: "Member 3", bio: "Ilagay dito ang description ni Member 3." },
    { name: "Member 4", bio: "Ilagay dito ang description ni Member 4." },
    { name: "Member 5", bio: "Ilagay dito ang description ni Member 5." },
    { name: "Member 6", bio: "Ilagay dito ang description ni Member 6." },
    { name: "Member 7", bio: "Ilagay dito ang description ni Member 7." },
    { name: "Member 8", bio: "Ilagay dito ang description ni Member 8." }
  ];

  /* ====== PALITAN DITO ANG MGA PICTURE NG GALLERY ======
     Ilagay ang file path sa loob ng quotes, hal. "images/v1/party.jpg".
     Habang blangko, placeholder ang lalabas.
     Pag handa na ang V6, palitan ang null ng listahan ng mga picture. */
  const GALLERY = {
    V1: ["images/v1/v1-1.jpg", "images/v1/v1-2.jpg"],
    V2: ["images/v2/v2-1.jpg", "images/v2/v2-2.jpg"],
    V3: ["", "", "", "", "", ""],
    V4: ["images/v4/v4-1.jpg", "images/v4/v4-2.jpg", "images/v4/v4-3.jpg", "images/v4/v4-4.jpg", "images/v4/v4-5.jpg"],
    V5: ["", "", "", "", "", ""],
    V6: null
  };

  /* Philippine time: 12:00 AM ng December 7, 2026 */
  const TARGET = new Date("2026-12-07T00:00:00+08:00").getTime();

  const COLORS = ["#ffffff", "#bdbdbd", "#8a8a8a", "#e0e0e0", "#a3a3a3"];
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const pick = (list) => list[Math.floor(Math.random() * list.length)];

  function confetti(count) {
    if (calm) return;
    for (let i = 0; i < count; i++) {
      const bit = document.createElement("i");
      bit.className = "bit";
      bit.style.left = Math.random() * 100 + "vw";
      bit.style.background = pick(COLORS);
      bit.style.animationDelay = Math.random() * .4 + "s";
      bit.style.setProperty("--t", 1.4 + Math.random() * 1.4 + "s");
      bit.style.setProperty("--dx", (Math.random() * 200 - 100) + "px");
      bit.style.setProperty("--spin", Math.random() * 900 + "deg");
      bit.addEventListener("animationend", () => bit.remove());
      document.body.append(bit);
    }
  }

  /* Title: bawat letra tumatalon */
  const title = $("lockup");
  const NS = "http://www.w3.org/2000/svg";
  function svgText(parent, char, size, attrs) {
    const el = document.createElementNS(NS, "text");
    el.textContent = char;
    el.setAttribute("font-size", size);
    for (const key in attrs) el.setAttribute(key, attrs[key]);
    parent.append(el);
    return el;
  }
  function addLetter(parent, char, size, paper, ink) {
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "letter");
    parent.append(g);
    const back = svgText(g, char, size, paper);
    const front = svgText(g, char, size, ink);
    const jump = () => {
      g.style.setProperty("--r", (Math.random() * 20 - 10) + "deg");
      g.classList.add("hit");
      setTimeout(() => g.classList.remove("hit"), 200);
    };
    g.addEventListener("pointerenter", jump);
    g.addEventListener("pointerdown", jump);
    return { g, back, front };
  }
  const rowTeam = document.createElementNS(NS, "g");
  const rowLikod = document.createElementNS(NS, "g");
  const rowVersion = document.createElementNS(NS, "g");
  rowVersion.setAttribute("class", "mark");
  title.append(rowLikod, rowTeam, rowVersion);

  const teamLetters = [..."TEAM"].map((c) => addLetter(rowTeam, c, 74,
    { fill: "#fff", stroke: "#fff", "stroke-width": 26, "stroke-linejoin": "round" },
    { fill: "#000" }));
  const likodLetters = [..."LIKOD"].map((c) => addLetter(rowLikod, c, 170,
    { fill: "url(#graph)", stroke: "url(#graph)", "stroke-width": 50, "stroke-linejoin": "round" },
    { fill: "#000" }));
  const version = addLetter(rowVersion, "V.6!", 72,
    { fill: "#000", stroke: "#000", "stroke-width": 8, "stroke-linejoin": "round" },
    { fill: "#fff" });

  function place(items, startX, y, gap) {
    let x = startX;
    items.forEach(({ back, front }) => {
      [back, front].forEach((t) => { t.setAttribute("x", x); t.setAttribute("y", y); });
      x += front.getComputedTextLength() + gap;
    });
    return x - gap;
  }
  function layoutLockup() {
    /* Baselines come from Sister Spray's real letter heights.
       Browser text boxes include empty font space, so they can't be used here. */
    const end = place(likodLetters, 20, 300, 6);
    place(teamLetters, 34, -6, 2);
    rowTeam.setAttribute("transform", "rotate(-4 34 -6)");
    const width = version.front.getComputedTextLength();
    const vx = end - width - 6;
    place([version], vx, 392, 0);
    rowVersion.setAttribute("transform", `rotate(-9 ${vx + width / 2} 368)`);
    title.setAttribute("viewBox", `-16 -190 ${Math.ceil(end + 52)} 610`);
  }
  layoutLockup();
  if (document.fonts) {
    Promise.allSettled([document.fonts.load('100px "Sister Spray"'), document.fonts.ready])
      .then(layoutLockup);
  }

  /* Flashlight sa mga sulat sa desk */
  const hero = $("hero");
  function shine(x, y) {
    const box = hero.getBoundingClientRect();
    hero.style.setProperty("--x", x - box.left + "px");
    hero.style.setProperty("--y", y - box.top + "px");
  }
  hero.addEventListener("pointermove", (e) => shine(e.clientX, e.clientY));
  hero.addEventListener("pointerdown", (e) => shine(e.clientX, e.clientY));

  /* Countdown */
  const clock = $("clock");
  const readout = $("readout");
  const fields = { days: $("days"), hours: $("hours"), minutes: $("minutes"), seconds: $("seconds") };
  const UNITS = {
    days: [86400, "araw"],
    hours: [3600, "oras"],
    minutes: [60, "minuto"],
    seconds: [1, "segundo"]
  };
  let pinned = "seconds";
  let timer;

  function setDigits(el, text) {
    if (el.children.length !== text.length) {
      el.replaceChildren(...[...text].map(() => {
        const box = document.createElement("span");
        box.className = "d";
        box.append(document.createElement("i"));
        return box;
      }));
    }
    [...text].forEach((char, i) => {
      const box = el.children[i];
      if (box.textContent === char) return;
      const next = document.createElement("i");
      next.textContent = char;
      box.replaceChildren(next);
    });
  }

  function syncPinned() {
    segs.forEach((seg) => seg.setAttribute("aria-pressed", seg.dataset.unit === pinned));
  }

  function tick() {
    const left = TARGET - Date.now();
    if (left <= 0) {
      clearInterval(timer);
      clock.innerHTML = '<div class="party-now">Party na, Likod!</div>';
      readout.remove();
      confetti(160);
      return;
    }
    const total = Math.floor(left / 1000);
    const values = {
      days: Math.floor(total / 86400),
      hours: Math.floor(total / 3600) % 24,
      minutes: Math.floor(total / 60) % 60,
      seconds: total % 60
    };
    for (const key in values) setDigits(fields[key], String(values[key]).padStart(2, "0"));
    const [size, label] = UNITS[pinned];
    readout.textContent = Math.floor(total / size).toLocaleString("en-US") + " " + label + " na lang.";
  }

  /* Pumili ng unit sa countdown */
  const segs = [...document.querySelectorAll(".seg")];
  segs.forEach((seg) => {
    seg.addEventListener("click", () => {
      pinned = seg.dataset.unit;
      syncPinned();
      tick();
    });
  });
  syncPinned();
  tick();
  timer = setInterval(tick, 1000);

  /* Gallery */
  function photoItem(src, version, i, isCopy) {
    const li = document.createElement("li");
    li.className = "photo";
    if (isCopy) li.setAttribute("aria-hidden", "true");
    if (src) {
      const img = document.createElement("img");
      img.src = src;
      img.alt = isCopy ? "" : "Team Likod " + version + ", larawan " + (i + 1);
      img.loading = "lazy";
      li.append(img);
    } else {
      li.textContent = "Larawan " + (i + 1);
    }
    return li;
  }

  Object.entries(GALLERY).forEach(([version, list]) => {
    const section = document.createElement("section");
    section.className = "block gallery";
    section.setAttribute("aria-labelledby", "gallery-" + version);

    const title = document.createElement("h2");
    title.id = "gallery-" + version;
    title.textContent = "Team Likod " + version;
    section.append(title);

    if (list) {
      const strip = document.createElement("div");
      strip.className = "strip";
      const photos = document.createElement("ul");
      photos.className = "photos";
      [false, true].forEach((isCopy) => {
        list.forEach((src, i) => photos.append(photoItem(src, version, i, isCopy)));
      });
      strip.append(photos);
      section.append(strip);
    } else {
      const soon = document.createElement("p");
      soon.className = "soon";
      soon.textContent = "Soon";
      section.append(soon);
    }

    $("galleries").append(section);
  });

  /* Mga miyembro */
  const team = $("team");
  MEMBERS.forEach((member) => {
    const li = document.createElement("li");
    li.className = "member";

    const face = document.createElement("div");
    face.className = "face";
    if (member.photo) {
      const img = document.createElement("img");
      img.src = member.photo;
      img.alt = member.name;
      img.loading = "lazy";
      face.append(img);
    } else {
      face.setAttribute("aria-hidden", "true");
      face.textContent = member.name.split(/\s+/).map((part) => part[0]).slice(0, 2).join("").toUpperCase();
    }

    const name = document.createElement("h3");
    name.textContent = member.name;
    const bio = document.createElement("p");
    bio.className = "bio";
    bio.textContent = member.bio;

    li.append(face, name, bio);
    team.append(li);
  });
</script>
</body>
</html>
